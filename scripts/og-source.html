<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#0a0b0d;color:#f5f6f8;font-family:Inter,system-ui,sans-serif;position:relative;overflow:hidden}
  .grid{position:absolute;inset:0;background-image:linear-gradient(#6b728022 1px,transparent 1px),linear-gradient(90deg,#6b728022 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 75% 40%,#000 5%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 75% 40%,#000 5%,transparent 70%)}
  .glow{position:absolute;right:-60px;top:-80px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.35),transparent 65%);filter:blur(30px)}
  .left{position:absolute;left:72px;top:0;bottom:0;width:620px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font:500 20px 'JetBrains Mono',monospace;color:#38bdf8;letter-spacing:.14em;text-transform:uppercase}
  h1{font-size:92px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:22px 0 14px}
  .role{font-size:42px;font-weight:600;color:#7dd3fc;letter-spacing:-.02em}
  .meta{margin-top:30px;font-size:26px;color:#9aa1ac;line-height:1.5}
  .pill{display:inline-flex;align-items:center;gap:10px;margin-top:34px;font-size:22px;color:#e6e8ec}
  .dot{width:12px;height:12px;border-radius:50%;background:#38bdf8;box-shadow:0 0 0 6px rgba(56,189,248,.25)}
  .phone{position:absolute;width:250px;height:510px;border-radius:44px;background:#07080b;padding:9px;box-shadow:0 0 0 2px #2b303b inset,0 0 0 1px #000,0 50px 90px -30px rgba(56,189,248,.5),0 25px 50px rgba(0,0,0,.65)}
  .phone .s{position:absolute;inset:9px;border-radius:36px;overflow:hidden}
  .phone img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .p1{left:760px;top:120px;transform:rotate(-8deg) scale(.88);opacity:.95}
  .p2{left:900px;top:56px;transform:rotate(6deg)}
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="left">
    <div class="eyebrow">Portfolio</div>
    <h1>Imran Ali Khan</h1>
    <div class="role">Senior Flutter Developer</div>
    <div class="meta">4.5+ years · 17+ apps shipped<br>Remote worldwide · Lahore, Pakistan</div>
    <div class="pill"><span class="dot"></span>Available immediately</div>
  </div>
  <div class="phone p1"><div class="s"><img src="../public/apps/rrr-academies.webp"></div></div>
  <div class="phone p2"><div class="s"><img src="../public/apps/rrr-home.webp"></div></div>
</body></html>
